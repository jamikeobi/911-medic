<!-- dashboard.component.html -->
<!-- <app-navbar></app-navbar> -->

<div class="admin-dashboard min-vh-100 position-relative overflow-hidden text-light">
  <div class="dashboard-bg"></div>

  <!-- Role Check Overlay (shown until role selected) -->
  <app-role-check 
    *ngIf="!role" 
    (roleSelected)="onRoleSelected()"
    class="position-fixed top-0 start-0 w-100 h-100 z-3">
  </app-role-check>

  <!-- Sidebar + Content (only when role selected) -->
  <div class="d-flex" *ngIf="role">
    <!-- Sidebar Toggle Button for Mobile -->
    <button 
      *ngIf="isMobile" 
      class="btn btn-primary sidebar-toggle position-fixed" 
      (click)="toggleSidebar()"
      [style.left.px]="sidebarOpen ? 260 : 20"
      style="top: 80px; z-index: 1000; transition: left 0.3s;">
      <i class="bi" [ngClass]="sidebarOpen ? 'bi-x-lg' : 'bi-list'"></i>
    </button>

    <!-- Sidebar -->
    <nav 
      class="sidebar bg-dark text-light p-3 flex-shrink-0" 
      [class.sidebar-open]="sidebarOpen"
      [class.sidebar-closed]="!sidebarOpen"
      style="width: 250px; min-height: 100vh; transition: transform 0.3s ease-in-out;">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="text-white mb-0">911Medic Admin</h4>
        <span class="badge" [ngClass]="role === 'owner' ? 'bg-primary' : 'bg-secondary'">
          {{ role === 'owner' ? 'Owner' : 'Staff' }}
        </span>
      </div>

      <ul class="list-unstyled">
        <li class="mb-2">
          <a routerLink="/admin/analytics" 
             routerLinkActive="active"
             class="text-light d-block py-2 px-3 rounded hover-bg">
            <i class="bi bi-graph-up me-2"></i>Analytics & Reports
          </a>
        </li>
        <li class="mb-2">
          <a routerLink="/admin/specialists" 
             routerLinkActive="active"
             class="text-light d-block py-2 px-3 rounded hover-bg">
            <i class="bi bi-people me-2"></i>Specialist Applications
          </a>
        </li>
        <li class="mb-2">
          <a routerLink="/admin/consultations" 
             routerLinkActive="active"
             class="text-light d-block py-2 px-3 rounded hover-bg">
            <i class="bi bi-chat-dots me-2"></i>Manage Consultations
          </a>
        </li>
        
        <!-- Owner-only links -->
        <ng-container *ngIf="role === 'owner'">
          <li class="mb-2">
            <a routerLink="/admin/confirm-payments" 
               routerLinkActive="active"
               class="text-light d-block py-2 px-3 rounded hover-bg">
              <i class="bi bi-currency-dollar me-2"></i>Confirm Payments
            </a>
          </li>
          <li class="mb-2">
            <a routerLink="/admin/dispatch" 
               routerLinkActive="active"
               class="text-light d-block py-2 px-3 rounded hover-bg">
              <i class="bi bi-truck me-2"></i>Dispatch Ambulances
            </a>
          </li>
          <li class="mb-2">
            <a routerLink="/admin/reports" 
               routerLinkActive="active"
               class="text-light d-block py-2 px-3 rounded hover-bg">
              <i class="bi bi-file-text me-2"></i>Detailed Reports
            </a>
          </li>
        </ng-container>
      </ul>
      <ul class="list-unstyled mt-auto">
        <li>
          <button class="btn btn-outline-light w-100" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <main 
      class="content flex-grow-1 p-4 p-md-5"
      [class.content-shifted]="sidebarOpen && !isMobile"
      [class.content-full]="!sidebarOpen || isMobile">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
